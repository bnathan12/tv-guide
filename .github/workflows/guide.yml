name: Update TV guide

on:
  schedule:
    - cron: '17 9 * * *'    # about 4-5 am Boston time
    - cron: '17 21 * * *'   # about 4-5 pm Boston time
  workflow_dispatch:         # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch listings
        shell: pwsh
        run: ./fetch.ps1
      - name: Save guide.json
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add guide.json
          git diff --cached --quiet || git commit -m "Guide update"
          git push
